<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f4f4" />
<meta name="color-scheme" content="light" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Трамвай" />
<meta name="format-detection" content="telephone=no" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.json" />
<title>Трамвай — Квиток</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--text:#000;--muted:#8d8d8d;--line:#e2e2e2;--accent:#673bda;--ok:#2d945c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;display:flex;justify-content:center;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button,input{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{width:100%;max-width:430px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0)}
.screen{flex:1;display:flex;flex-direction:column;padding:24px 24px 0}
.hidden{display:none!important}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.header h1{font-size:20px;font-weight:600}
.icon-store{width:48px;height:48px;border-radius:50%;background:linear-gradient(160deg,#6a45ea,#4a2bd4);display:grid;place-items:center}
.icon-store svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round}
.price{text-align:center;margin-bottom:42px}
.price-label{color:var(--muted);font-size:14px;margin-bottom:12px}
.price-value{font-size:40px;font-weight:800;line-height:1.1}
.pill{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:50px;height:56px;padding:7px 9px}
.pill+.pill{margin-top:14px}
.pill button{position:relative;flex:none;width:40px;height:40px;border-radius:50%;border:0;font-size:24px;line-height:1;cursor:pointer;display:grid;place-items:center;background:#000;color:#fff}
.pill button::after{content:"";position:absolute;inset:-6px}
.pill button:disabled{background:#cdcdcd;cursor:not-allowed}
.pill button:active:not(:disabled){opacity:.7}
.pill-info{text-align:center;min-width:0;flex:1}
.pill-info .value{display:block;width:100%;border:0;background:transparent;text-align:center;font-size:22px;font-weight:600;line-height:1.1;padding:0;border-radius:6px}
.pill-info .label{font-size:12px;font-weight:500;color:#555;text-transform:uppercase;letter-spacing:.4px}
.pay{margin:auto -24px 0;background:#fff;padding:17px 24px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:15px}
.btn{width:100%;height:48px;padding:0;border-radius:12px;border:0;font-size:17px;font-weight:500;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
.btn:active{opacity:.8}
.btn-black{background:#000;color:#fff}
.btn-link{background:none;color:var(--accent);font-size:16px;font-weight:600;height:auto;padding:4px 0 8px}
.mono{font-size:22px;font-weight:800;letter-spacing:-.3px}
.badge-pay{background:#fff;color:#000;height:26px;padding:0 9px;border-radius:7px;font-size:21px;font-weight:800;display:grid;place-items:center}

#screen-ticket{padding:59px 16px max(24px,env(safe-area-inset-bottom))}
.ticket{position:relative;background:var(--card);border-radius:24px;text-align:center;padding-bottom:24px}
.ticket-icon{position:absolute;left:50%;top:-16px;transform:translate(-50%,-50%);z-index:2;width:68px;height:68px;border-radius:50%;border:5px solid var(--bg);background:var(--bg);padding:0;cursor:pointer}
.ticket-icon:active{opacity:.7}
.ticket-icon img{width:100%;height:100%;display:block;border-radius:50%}
.marquee{overflow:hidden;background:#e7f2f0;color:#1f6f63;font-size:18px;font-weight:600;line-height:1.25;padding:6px 0;margin-top:28px;white-space:nowrap}
.marquee-track{display:inline-flex;will-change:transform;-webkit-animation:marquee 45s linear infinite;animation:marquee 45s linear infinite}
.marquee-track span{padding-right:.28em}
@-webkit-keyframes marquee{to{-webkit-transform:translateX(-50%)}}
@keyframes marquee{to{transform:translateX(-50%)}}

.t-title{font-size:18px;font-weight:600;margin:12px 0 18px}
.t-hr{border:0;border-top:1px solid var(--line);width:120px;margin:0 auto 18px}
.t-date{color:var(--muted);font-size:14px;margin-bottom:14px}
.t-qty{font-size:38px;font-weight:700;line-height:1.1;margin-bottom:8px;display:flex;justify-content:center;align-items:baseline;gap:.25em}
.t-timer{display:inline-flex;align-items:center;gap:10px;height:35px;background:linear-gradient(90deg,#d6ece0,#d4e9fc);color:#000;padding:0 24px;border-radius:30px;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;margin-bottom:18px}
.ring{width:16px;height:16px;flex:none;display:block}
.ring circle{fill:none;stroke-width:3.2}
.ring .trk{stroke:#c4c9cd}
.ring .arc{stroke:var(--ok);stroke-linecap:butt}
.t-timer.expired{background:#fadbd8;color:#9b1c1c}
.t-tram{font-size:17px;color:#777;margin-bottom:28px}
.t-tram b{font-size:24px;font-weight:700;color:#000;margin-left:4px}
.sep{position:relative;height:2px;margin:0 24px 46px;background:repeating-linear-gradient(90deg,#cfcfcf 0 10px,transparent 10px 20px)}
.sep::before,.sep::after{content:"";position:absolute;top:-11px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.sep::before{left:-36px}.sep::after{right:-36px}
.qr{position:relative;width:233px;max-width:100%;aspect-ratio:1;margin:0 auto;padding:24px;border-radius:24px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.09)}
.qr svg.code{width:100%;height:100%;display:block}
.qr .cat{position:absolute;left:50%;top:50%;width:15%;transform:translate(-50%,-50%)}
.qr.dead{opacity:.25}
.back{margin-top:16px;padding:16px;border-radius:14px;border:1px solid #c7c7cc;background:none;font-size:16px;font-weight:600;cursor:pointer}
.back:active{background:#e5e5ea}
@media (max-width:360px){
  .screen{padding-left:16px;padding-right:16px}.pay{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
  .price-value{font-size:36px}.t-qty{font-size:34px}.t-timer{padding:0 16px;font-size:15px}.qr{padding:20px}
}
/* iPhone 11 Pro: 375x812 pt, safe area 44 top / 34 bottom */
@media (device-width:375px) and (device-height:812px){
  #app{max-width:375px}
  .ticket{padding-bottom:20px}
  .back{margin-top:12px;height:44px;padding:0}
}
@media (max-height:700px){
  .price{margin-bottom:26px}.sep{margin-bottom:28px}.t-tram{margin-bottom:20px}.header{margin-bottom:12px}
}
@media (orientation:landscape) and (max-height:500px){
  #app{max-width:520px}.pay{margin-top:24px}
}
</style>
</head>
<body>
<main id="app">
  <section id="screen-selection" class="screen">
    <div class="header">
      <h1>Трамвай</h1>
      <div class="icon-store" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 9 5.5 4h13L20 9M4 9h16M4 9v11h16V9M10 20v-5h4v5"/></svg></div>
    </div>
    <div class="price">
      <div class="price-label">Вартість покупки</div>
      <div class="price-value" id="price" aria-live="polite">25 ₴</div>

    <div class="pill">
      <button id="minus" aria-label="Зменшити кількість квитків" disabled>−</button>

      <button id="tplus" aria-label="Наступний номер трамвая">+</button>
    </div>

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;

        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

  var gifImage = function(width, height) {

      //---------------------------------
      // Global Color Map

      // black
      out.writeByte(0x00);

      // white
      out.writeByte(0xff);

      //---------------------------------
      // Image Descriptor

      out.writeString(',');

      //---------------------------------

  var createDataURL = function(width, height, getPixel) {

// multibyte support

  qrcode.stringToBytesFuncs['UTF-8'] = function(s) {
    // http://stackoverflow.com/questions/18729405/how-to-convert-utf8-string-to-byte-array

</script>
<script>
const PRICE=25, MAX=10, LIFETIME=3600e3, KEY="tram-ticket";
const $=id=>document.getElementById(id);
const tramParam=parseInt(new URLSearchParams(location.search).get("tram"),10);
let tram=tramParam>0&&tramParam<=999?tramParam:423;
let qty=1, timer=null;

const word=n=>{const a=n%10,b=n%100;return a===1&&b!==11?"квиток":a>=2&&a<=4&&(b<12||b>14)?"квитки":"квитків"};
const MONTHS=["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const pad=n=>String(n).padStart(2,"0");

function renderQty(){
  $("qty").textContent=qty; $("qty-label").textContent=word(qty);
  $("price").textContent=`${PRICE*qty} ₴`;
  $("minus").disabled=qty<=1; $("plus").disabled=qty>=MAX;
}
$("plus").onclick=()=>{if(qty<MAX){qty++;renderQty()}};
function renderTram(){$("tram-val").value=tram;$("tminus").disabled=tram<=1;$("tplus").disabled=tram>=999}
$("tplus").onclick=()=>{if(tram<999){tram++;renderTram()}};
$("tram-val").addEventListener("input",e=>{
  const i=e.target,v=i.value.replace(/\D/g,"").slice(0,3);i.value=v;
  const n=parseInt(v,10);if(n>=1)tram=n;
  $("tminus").disabled=tram<=1;$("tplus").disabled=tram>=999;
});
$("tram-val").addEventListener("focus",e=>e.target.select());
$("tram-val").addEventListener("blur",renderTram);
$("tram-val").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});
$("tminus").onclick=()=>{if(tram>1){tram--;renderTram()}};
$("minus").onclick=()=>{if(qty>1){qty--;renderQty()}};

function qrSvg(text){
  const q=qrcode(0,"H"); q.addData(text); q.make();
  const n=q.getModuleCount(), c=n/2, hole=n*.115, R=.45;
  const D=(r,k)=>r>=0&&k>=0&&r<n&&k<n&&q.isDark(r,k);
  let d="";
  for(let r=0;r<n;r++)for(let k=0;k<n;k++){
    if(!D(r,k)||(Math.abs(r+.5-c)<hole&&Math.abs(k+.5-c)<hole))continue;
    const u=D(r-1,k),b=D(r+1,k),l=D(r,k-1),rt=D(r,k+1);
    const tl=!u&&!l?R:0,tr=!u&&!rt?R:0,br=!b&&!rt?R:0,bl=!b&&!l?R:0;
    d+=`M${k+tl} ${r}h${1-tl-tr}a${tr} ${tr} 0 0 1 ${tr} ${tr}v${1-tr-br}a${br} ${br} 0 0 1 ${-br} ${br}h${-(1-br-bl)}a${bl} ${bl} 0 0 1 ${-bl} ${-bl}v${-(1-bl-tl)}a${tl} ${tl} 0 0 1 ${tl} ${-tl}z`;
  }
  return `<svg class="code" viewBox="0 0 ${n} ${n}" role="img" aria-label="QR-код квитка"><path d="${d}"/></svg>`;
}

let wake=null;
async function keepAwake(){try{if("wakeLock" in navigator&&!wake)wake=await navigator.wakeLock.request("screen");if(wake)wake.addEventListener("release",()=>{wake=null})}catch(e){}}
function releaseAwake(){try{if(wake)wake.release();wake=null}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!$("screen-ticket").classList.contains("hidden"))keepAwake()});
function showTicket(t){
  const d=new Date(t.at);
  $("t-date").textContent=`Придбано ${d.getDate()} ${MONTHS[d.getMonth()]} о ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $("t-qty").innerHTML=`<span>${t.qty}</span><span>${word(t.qty)}</span>`;
  $("t-tram").textContent=`№ ${t.tram}`;
  $("marquee").innerHTML=[0,1].map(()=>`<span>Найголовніше — залишайтеся людьми і кричіть, що ви живі. Я живий! Життя — цікаве, і мотивація то є сильна: філософія, психологія.</span>`).join("");
  $("qr-code").innerHTML=qrSvg(`TramTicket-${t.tram}-${t.qty}-${t.at}`);
  $("screen-selection").classList.add("hidden");
  $("screen-ticket").classList.remove("hidden");
  window.scrollTo(0,0);
  clearInterval(timer);
  const arc=$("arc"),C=50.27;
  const setArc=(f,anim)=>{arc.style.transition=anim?"stroke-dashoffset 1s linear":"none";arc.style.strokeDashoffset=C*(1-Math.max(0,Math.min(1,f)))};
  let first=true;
  const tick=()=>{
    const left=Math.ceil((t.at+LIFETIME-Date.now())/1000), el=$("t-timer");
    if(left<=0){
      $("t-time").textContent="Квиток недійсний"; el.classList.add("expired");
      setArc(0,false); $("qr").classList.add("dead"); clearInterval(timer); return;
    }
    el.classList.remove("expired"); $("qr").classList.remove("dead");
    $("t-time").textContent=`Квиток дійсний — ${pad(Math.floor(left/60))}:${pad(left%60)}`;
    if(first){setArc(left/3600,false);void arc.getBoundingClientRect();first=false}
    setArc((left-1)/3600,true);
  };
  keepAwake();
  tick(); timer=setInterval(tick,1000);
}

document.querySelectorAll(".buy").forEach(b=>b.onclick=()=>{
  showTicket({tram,qty,at:Date.now()});
});
$("back").onclick=()=>{
  clearInterval(timer);releaseAwake();
  $("screen-ticket").classList.add("hidden");
  $("screen-selection").classList.remove("hidden");
  qty=1; renderQty(); window.scrollTo(0,0);
};

document.addEventListener("touchstart",()=>{},{passive:true});
document.addEventListener("pointerdown",e=>{const a=document.activeElement;if(a&&a.tagName==="INPUT"&&e.target!==a)a.blur()});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(()=>{});
renderQty();renderTram();
</script>
</body>
</html>
